name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rapida:
    name: Suíte rápida (todo commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build   # gera o out/ e a CSP do vercel.json; os testes de CSP conferem os hashes contra ele
      - run: git diff --exit-code vercel.json   # vercel.json commitado tem que ser o que o build gera
      - run: npm test

  lenta:
    name: Suíte lenta (corpus completo, 1 MB hostil e cobertura com limite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:slow
